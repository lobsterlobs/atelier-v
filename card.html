<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier V — Digital Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A;--gold:#C9A84C;--gold-l:#e8c96a;
  --white:#fff;--off:#F9F8F6;--muted:#777;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}

body{
  font-family:'Jost',sans-serif;
  min-height:100vh;
  background:var(--navy);
  background-image:
    radial-gradient(ellipse at 15% 60%, rgba(201,168,76,.07) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 20%, rgba(201,168,76,.05) 0%, transparent 50%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:48px 20px;
  position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(201,168,76,.12) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none;z-index:0;
}

.page-inner{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  display:flex;flex-direction:column;align-items:center;
}

/* ── CARD ── */
.card{
  width:100%;
  box-shadow:0 48px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(201,168,76,.18);
  animation:cardIn .9s cubic-bezier(.22,.68,0,1.2) forwards;
  opacity:0;transform:translateY(28px) scale(.97);
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}

/* ── TOP – NAVY ── */
.card-top{
  background:var(--navy);
  padding:0 44px 44px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
/* Gold top bar */
.card-top::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-l),var(--gold));
}
/* Decorative circle */
.card-top::after{
  content:'';position:absolute;
  bottom:-60px;right:-60px;
  width:220px;height:220px;
  border-radius:50%;
  border:1px solid rgba(201,168,76,.08);
  pointer-events:none;
}

.card-logo-wrap{
  padding-top:52px; /* clears the 3px bar + spacing */
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
}
/* Actual logo loaded via JS */
.card-logo-img{
  height:72px;width:auto;
  display:none; /* shown once src is set */
  filter:brightness(0) invert(1);
}
/* Fallback text shown until/if logo loads */
.card-logo-fallback{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:300;font-style:italic;
  color:var(--white);
  letter-spacing:.12em;
}
.card-logo-fallback em{
  font-style:normal;color:var(--gold);
}

/* ── DIVIDER ── */
.card-divider{
  height:1px;background:var(--white);
  display:flex;align-items:center;justify-content:center;
}
.card-divider-gem{
  width:8px;height:8px;
  background:var(--gold);transform:rotate(45deg);
  position:relative;z-index:1;
  box-shadow:0 0 0 4px var(--white);
}

/* ── BOTTOM – CREAM ── */
.card-bottom{
  background:var(--off);
  padding:40px 44px 44px;
}

.contact-list{list-style:none;margin-bottom:28px;}
.contact-item{
  display:flex;align-items:center;gap:16px;
  padding:11px 0;
  border-bottom:1px solid rgba(27,42,74,.07);
}
.contact-item:last-child{border-bottom:none;}

.contact-icon{
  width:38px;height:38px;
  background:var(--navy);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .25s;
}
.contact-item:hover .contact-icon{background:var(--gold);}
.contact-item:hover .contact-icon svg{fill:var(--navy);}
.contact-icon svg{width:15px;height:15px;fill:var(--gold);transition:fill .25s;}

.contact-info{display:flex;flex-direction:column;gap:2px;}
.contact-label{
  font-family:'Jost',sans-serif;
  font-size:9px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
}
.contact-value{
  font-family:'Jost',sans-serif;
  font-size:14px;font-weight:400;
  color:var(--navy);text-decoration:none;
  transition:color .2s;
}
.contact-value:hover{color:var(--gold);}

/* ── QR ── */
.qr-wrap{
  display:flex;align-items:center;gap:20px;
  padding:18px;
  background:var(--white);
  border:1px solid rgba(27,42,74,.08);
  margin-bottom:24px;
}
.qr-img-wrap{
  flex-shrink:0;width:100px;height:100px;
  display:flex;align-items:center;justify-content:center;
  background:var(--white);
}
.qr-img-wrap img{display:block;width:100px;height:100px;}

.qr-info{flex:1;}
.qr-eyebrow{
  font-family:'Jost',sans-serif;
  font-size:9px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px;
}
.qr-desc{
  font-family:'Jost',sans-serif;
  font-size:12px;font-weight:300;
  line-height:1.65;color:var(--muted);
}

/* ── BUTTON ── */
.btn-save{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 24px;
  background:var(--navy);color:var(--gold);
  font-family:'Jost',sans-serif;
  font-size:11px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;
  border:none;cursor:pointer;
  position:relative;overflow:hidden;transition:color .3s;
}
.btn-save::before{
  content:'';
  position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:var(--gold);
  transition:left .32s cubic-bezier(.4,0,.2,1);z-index:0;
}
.btn-save:hover::before{left:0;}
.btn-save:hover{color:var(--navy);}
.btn-save svg{width:14px;height:14px;fill:currentColor;position:relative;z-index:1;flex-shrink:0;}
.btn-save span{position:relative;z-index:1;}

/* ── BACK LINK ── */
.back-link{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:28px;
  font-family:'Jost',sans-serif;
  font-size:10px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
  text-decoration:none;transition:color .25s;
}
.back-link:hover{color:var(--gold);}
.back-link svg{width:12px;height:12px;fill:currentColor;}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .card-top{padding:0 28px 36px;}
  .card-bottom{padding:32px 28px 36px;}
  .qr-wrap{flex-direction:column;align-items:flex-start;gap:16px;}
}
</style>
</head>
<body>

<div class="page-inner">
  <div class="card">

    <!-- TOP: NAVY + LOGO -->
    <div class="card-top">
      <div class="card-logo-wrap">
        <img id="card-logo" class="card-logo-img" alt="Atelier V">
        <span class="card-logo-fallback">Atelier <em>V</em></span>
      </div>
    </div>

    <!-- ORNAMENTAL DIVIDER -->
    <div class="card-divider">
      <div class="card-divider-gem"></div>
    </div>

    <!-- BOTTOM: CONTACTS -->
    <div class="card-bottom">

      <ul class="contact-list">
        <li class="contact-item">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.28-.27.7-.36 1.06-.23 1.16.4 2.42.61 3.74.61.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.18 21 3 13.82 3 5c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.33.21 2.6.61 3.76.11.36.03.77-.21 1.04L6.6 10.8z"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Phone</span>
            <a href="tel:+359888355777" class="contact-value">+359 888 355 777</a>
          </div>
        </li>
        <li class="contact-item">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Email</span>
            <a href="mailto:bkarakonov@gmail.com" class="contact-value">bkarakonov@gmail.com</a>
          </div>
        </li>
        <li class="contact-item">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Instagram</span>
            <a href="https://instagram.com/atelierv.design" class="contact-value" target="_blank" rel="noopener">@atelierv.design</a>
          </div>
        </li>
        <li class="contact-item">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Studio</span>
            <span class="contact-value">Atelier V — Digital Branding Studio</span>
          </div>
        </li>
      </ul>

      <!-- QR CODE -->
      <div class="qr-wrap">
        <div class="qr-img-wrap">
          <img id="qrcode" alt="QR Code">
        </div>
        <div class="qr-info">
          <div class="qr-eyebrow">Scan &amp; Save</div>
          <p class="qr-desc">Point your camera at the QR code to save Atelier V directly to your contacts.</p>
        </div>
      </div>

      <!-- SAVE CONTACT BUTTON -->
      <button class="btn-save" onclick="downloadVCF()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Save Contact</span>
      </button>

    </div>
  </div>

  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back to website
  </a>
</div>

<script>
const VCARD = [
  'BEGIN:VCARD',
  'VERSION:3.0',
  'FN:Atelier V',
  'ORG:Atelier V — Digital Branding Studio',
  'TEL;TYPE=WORK,VOICE:+359888355777',
  'EMAIL;TYPE=INTERNET:bkarakonov@gmail.com',
  'URL:https://instagram.com/atelierv.design',
  'END:VCARD'
].join('\r\n');

// QR code via api.qrserver.com
document.getElementById('qrcode').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=100x100&color=1B2A4A&bgcolor=ffffff&data=' +
  encodeURIComponent(VCARD);

// Load real logo from index.html (avoids duplicating 100 KB+ of base64)
fetch('index.html')
  .then(r => r.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const navImg = doc.querySelector('.nav-logo img');
    if (navImg) {
      const logoEl = document.getElementById('card-logo');
      logoEl.src = navImg.getAttribute('src');
      logoEl.style.display = 'block';
      const fallback = document.querySelector('.card-logo-fallback');
      if (fallback) fallback.style.display = 'none';
    }
  })
  .catch(() => { /* fallback text stays visible */ });

function downloadVCF() {
  const blob = new Blob([VCARD], { type: 'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'AtelierV.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
